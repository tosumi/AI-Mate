<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- タイトル画面の仮の絵(M11 の手順1)。差し替えるときは、web/public/ に title.webp / title.png / title.jpg を置く(こちらより先に使う) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c3d"/>
      <stop offset="0.55" stop-color="#5b3f8f"/>
      <stop offset="0.85" stop-color="#c58aa8"/>
      <stop offset="1" stop-color="#f3c9a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#ffe7c4" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe7c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e9e1ff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bubbleB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9f1" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffd9c2" stop-opacity="0.82"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- 星 -->
  <g fill="#fff">
    <circle cx="120" cy="90" r="2" opacity="0.8"/><circle cx="260" cy="160" r="1.5" opacity="0.6"/>
    <circle cx="410" cy="70" r="2.5" opacity="0.9"/><circle cx="560" cy="200" r="1.5" opacity="0.5"/>
    <circle cx="720" cy="110" r="2" opacity="0.7"/><circle cx="900" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="1040" cy="170" r="2.5" opacity="0.8"/><circle cx="1190" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="1330" cy="150" r="2" opacity="0.7"/><circle cx="1480" cy="70" r="2.5" opacity="0.9"/>
    <circle cx="200" cy="300" r="1.5" opacity="0.4"/><circle cx="1400" cy="290" r="1.5" opacity="0.4"/>
  </g>
  <!-- 遠くの丘 -->
  <path d="M0 760 C 260 690 480 720 760 750 S 1260 690 1600 730 V 900 H 0 Z" fill="#3a2a5e" opacity="0.55"/>
  <path d="M0 820 C 300 770 620 800 900 815 S 1380 780 1600 800 V 900 H 0 Z" fill="#2a1f45" opacity="0.7"/>
  <!-- 重なった2つの吹き出し(会話) -->
  <g transform="translate(560 150)">
    <path d="M40 0 H 300 A 40 40 0 0 1 340 40 V 150 A 40 40 0 0 1 300 190 H 120 L 70 240 L 80 190 H 40 A 40 40 0 0 1 0 150 V 40 A 40 40 0 0 1 40 0 Z" fill="url(#bubbleA)"/>
    <g fill="#6a4fc1" opacity="0.75"><circle cx="110" cy="95" r="14"/><circle cx="170" cy="95" r="14"/><circle cx="230" cy="95" r="14"/></g>
  </g>
  <g transform="translate(800 240)">
    <path d="M40 0 H 260 A 40 40 0 0 1 300 40 V 130 A 40 40 0 0 1 260 170 H 230 L 240 215 L 190 170 H 40 A 40 40 0 0 1 0 130 V 40 A 40 40 0 0 1 40 0 Z" fill="url(#bubbleB)"/>
    <path d="M150 52 l 9 22 23 2 -18 15 6 23 -20 -13 -20 13 6 -23 -18 -15 23 -2 Z" fill="#c2577a" opacity="0.7"/>
  </g>
</svg>

[project]
name = "mycompanion"
version = "0.1.0"
description = "感情理解型 対話パートナーAI(MyCompanion)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "psycopg[binary,pool]>=3.2",
    "azure-identity>=1.17",
    "azure-cosmos>=4.7",
    "azure-servicebus>=7.12",
    "azure-keyvault-secrets>=4.8",
    "openai>=1.107",
    "typer>=0.12",
    "msal>=1.30",
    "msal-extensions>=1.2",
    "aiohttp>=3.10",
    "pyyaml>=6.0",
    "azure-monitor-opentelemetry>=1.6",
    "pywebpush>=2.0",
]

[project.scripts]
companion = "mycompanion.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycompanion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "azure: 実際の Azure リソースに接続するテスト(.env の値が必要。既定では実行しない)",
]
addopts = "-m 'not azure'"

[tool.ruff]
line-length = 110
target-version = "py312"

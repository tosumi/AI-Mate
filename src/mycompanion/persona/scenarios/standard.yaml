# ---------------------------------------------------------------------------
# 自発発話(無入力時にキャラクタから話しかける。本体仕様書 §8.6、§15.1 の M8)
# `proactive` は、会話のあとの時刻(開始日から何日後の、ユーザーのローカル時刻)ごとの判定。
# `expect` は、止めた理由のコード、または {high: …, low: …}(自発性がしきい値以上 / 未満のキャラクタ)。
# どのシナリオでも、静穏時間帯に話さない・返事なしに続けない・罪悪感や催促を言わない、を自動で検査する。
# ---------------------------------------------------------------------------

- id: P1
  title: 自発発話の間隔・静穏時間帯・追撃の上限
  memories:
    - {summary: ユーザーは週末に果物狩りに出かけた, topics: [果物狩り], preference: 0.8, valence: 0.6}
    - {summary: ユーザーは新しいカフェを見つけて気に入った, topics: [カフェ], preference: 0.7, valence: 0.6}
    - {summary: ユーザーは近所の公園で桜を見た, topics: [桜], preference: 0.7, valence: 0.6}
    - {summary: ユーザーは新しい自転車を買った, topics: [自転車], preference: 0.7, valence: 0.6}
  turns:
    - text: 今日は駅前を散歩してきたところなんだ
  proactive:
    - {at: "0d13:00", expect: too_soon}  # 会話の1時間後
    - {at: "0d22:00", expect: quiet_hours}
    - {at: "1d08:00", expect: quiet_hours}
    - {at: "1d13:00", expect: {high: ok, low: no_topic}}  # 自発性の低いキャラクタは、予定の「その後」だけ
    - {at: "1d15:00", expect: {high: in_session, low: no_topic}}  # 返事を待っている
    - {at: "3d13:00", close: true, expect: {high: unanswered, low: no_topic}}  # 返事がなければ、続けて話しかけない

- id: P2
  title: 返事のあとの、同じ日の2回目と、日が変わったあと
  memories:
    - {summary: ユーザーは週末に果物狩りに出かけた, topics: [果物狩り], preference: 0.8, valence: 0.6}
    - {summary: ユーザーは新しいカフェを見つけて気に入った, topics: [カフェ], preference: 0.7, valence: 0.6}
    - {summary: ユーザーは近所の公園で桜を見た, topics: [桜], preference: 0.7, valence: 0.6}
    - {summary: ユーザーは新しい自転車を買った, topics: [自転車], preference: 0.7, valence: 0.6}
    - {summary: ユーザーはパン作りを始めた, topics: [パン作り], preference: 0.7, valence: 0.6}
    - {summary: ユーザーは水族館に行った, topics: [水族館], preference: 0.7, valence: 0.6}
  turns:
    - text: 今日は駅前を散歩してきたところなんだ
  proactive:
    - {at: "1d10:00", reply: 今日は仕事が忙しかったけど、なんとか終わったよ, expect: {high: ok}}  # 低い方は、間隔しだいで too_soon / no_topic
    - {at: "1d12:00", expect: {high: too_soon, low: no_topic}}  # 返事から1.5時間
    - {at: "1d15:30", reply: そうそう、帰りにおいしいパンを買ったんだ, expect: {high: ok, low: no_topic}}  # 2回目は短い間隔
    - {at: "1d20:30", reply: ありがとう、今日はもう寝るね}  # 3回目: 1日の上限は性格で1〜3回(結果は記録だけ)
    - {at: "2d13:00", expect: {high: ok, low: no_topic}}  # 日が変わると、数え直す

- id: P3
  title: 最後の会話で怒っていたら、話しかけない
  memories:
    - {summary: ユーザーは週末に果物狩りに出かけた, topics: [果物狩り], preference: 0.8, valence: 0.6}
  turns:
    - text: もう最悪。何もかもうまくいかないし、ほんとに腹が立つ
      estimate: {categories: {anger: 0.8, sadness: 0.3}, vad: {v: -0.7, a: 0.7, d: 0.1}, confidence: 0.8, needs: [listen]}
  proactive:
    - {at: "2d13:00", expect: negative_mood}

- id: P4
